[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mermaid-marinetraffic"
dynamic = ["version"]
description = "Prepare MERMAID GPS trajectories for MarineTraffic Custom Area imports."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
mermaid-marinetraffic = "mermaid_marinetraffic.cli:main"

[tool.setuptools.dynamic]
version = {file = ["src/mermaid_marinetraffic/VERSION"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mermaid_marinetraffic = ["VERSION"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
