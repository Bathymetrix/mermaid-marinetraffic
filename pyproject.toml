[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "merinetraffic"
dynamic = ["version"]
description = "Prepare recent MERMAID GPS histories for MarineTraffic Custom Area imports."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
merinetraffic = "merinetraffic.cli:main"

[tool.setuptools.dynamic]
version = {file = ["src/merinetraffic/VERSION"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
merinetraffic = ["VERSION"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
